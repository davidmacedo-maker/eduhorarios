version: '3.8'

services:
  eduhorarios-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eduhorarios_prod
    ports:
      - "8080:80"
    environment:
      - VITE_SUPABASE_URL=${VITE_SUPABASE_URL:-}
      - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY:-}
    env_file:
      - .env
    restart: unless-stopped

